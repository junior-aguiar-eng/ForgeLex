services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forgelex
      POSTGRES_USER: forgelex
      POSTGRES_PASSWORD: forgelex
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgelex -d forgelex"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - forgelex-postgres:/var/lib/postgresql/data

volumes:
  forgelex-postgres:
