<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238E5D2A'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tema (V1), escolhido antes da primeira pintura. VITE_FORGELEX_THEME vale "classico" (padrão), "gelo" ou "previa"
      (clássico, com ?tema=gelo guardado no navegador, só para homologação). Qualquer outro valor, ou a variável sem
      valor, é o tema clássico. O tema gelo pré-carrega só a Inter 400, troca o favicon e define a cor da barra do navegador (theme-color); o clássico não mexe em nenhum dos dois.
    -->
    <script data-theme-script>
      (function () {
        var configured = '%VITE_FORGELEX_THEME%';
        var theme = 'classico';
        try {
          if (configured === 'gelo') {
            theme = 'gelo';
          } else if (configured === 'previa') {
            var asked = /[?&]tema=(gelo|classico)(?:&|$)/.exec(location.search);
            if (asked) theme = asked[1];
            try {
              if (asked) localStorage.setItem('forgelex.tema', theme);
              else if (localStorage.getItem('forgelex.tema') === 'gelo') theme = 'gelo';
            } catch (storageBlocked) {
              /* sem armazenamento: vale o parâmetro da página, ou o clássico */
            }
          }
        } catch (ignored) {
          /* qualquer falha deixa o tema clássico */
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'gelo') {
          var preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'font';
          preload.type = 'font/woff2';
          preload.href = '/fonts/inter-latin-400-normal.woff2';
          preload.crossOrigin = 'anonymous';
          document.head.appendChild(preload);
          // V6: favicon (o símbolo do ForgeLex, 27/11) e cor da barra do navegador na paleta do gelo (acento e fundo de apps/web/src/index.css).
          var icon = document.querySelector && document.querySelector('link[rel="icon"]');
          if (icon) {
            icon.setAttribute(
              'href',
              '/brand/forgelex-simbolo.svg',
            );
          }
          var color = document.createElement('meta');
          color.name = 'theme-color';
          color.content = '#F4F7F8';
          document.head.appendChild(color);
        }
      })();
    </script>
