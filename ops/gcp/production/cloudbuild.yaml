steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY}
      - --build-arg
      - EXPECTED_SUPABASE_PROJECT_REF=${_SUPABASE_PROJECT_REF}
      - --build-arg
      - VITE_FORGELEX_SAVED_RESEARCH_ENABLED=${_VITE_FORGELEX_SAVED_RESEARCH_ENABLED}
      - --build-arg
      - VITE_FORGELEX_CASE_WORKSPACE_ENABLED=${_VITE_FORGELEX_CASE_WORKSPACE_ENABLED}
      - --build-arg
      - VITE_FORGELEX_AGENTIC_WORKSPACE_ENABLED=${_VITE_FORGELEX_AGENTIC_WORKSPACE_ENABLED}
      - --build-arg
      - VITE_FORGELEX_DESK_SHELL=${_VITE_FORGELEX_DESK_SHELL}
      - --build-arg
      - VITE_FORGELEX_ATTACHMENTS_ENABLED=${_VITE_FORGELEX_ATTACHMENTS_ENABLED}
      - --build-arg
      - VITE_FORGELEX_MATTER_CHIPS_ENABLED=${_VITE_FORGELEX_MATTER_CHIPS_ENABLED}
      - --build-arg
      - VITE_FORGELEX_OCR_ENABLED=${_VITE_FORGELEX_OCR_ENABLED}
      - --build-arg
      - VITE_FORGELEX_THEME=${_VITE_FORGELEX_THEME}
      - --build-arg
      - VITE_FORGELEX_PUBLIC_MODEL=${_VITE_FORGELEX_PUBLIC_MODEL}
      - --build-arg
      - VITE_PUBLIC_ORIGIN=${_VITE_PUBLIC_ORIGIN}
      - --tag
      - ${_IMAGE_URI}:${_SOURCE_SHA}
      - .
images:
  - ${_IMAGE_URI}:${_SOURCE_SHA}
substitutions:
  _VITE_FORGELEX_SAVED_RESEARCH_ENABLED: 'false'
  _VITE_FORGELEX_AGENTIC_WORKSPACE_ENABLED: 'false'
  _VITE_FORGELEX_CASE_WORKSPACE_ENABLED: 'false'
  _VITE_FORGELEX_DESK_SHELL: 'false'
  _VITE_FORGELEX_ATTACHMENTS_ENABLED: 'false'
  _VITE_FORGELEX_MATTER_CHIPS_ENABLED: 'false'
  _VITE_FORGELEX_OCR_ENABLED: 'false'
  _VITE_FORGELEX_THEME: 'classico'
  _VITE_FORGELEX_PUBLIC_MODEL: 'false'
  _VITE_PUBLIC_ORIGIN: 'https://nexojuris.ia.br'
