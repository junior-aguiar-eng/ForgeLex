steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY}
      - --build-arg
      - EXPECTED_SUPABASE_PROJECT_REF=${_SUPABASE_PROJECT_REF}
      - --build-arg
      - VITE_FORGELEX_SAVED_RESEARCH_ENABLED=${_VITE_FORGELEX_SAVED_RESEARCH_ENABLED}
      - --tag
      - ${_IMAGE_URI}:${_SOURCE_SHA}
      - .
images:
  - ${_IMAGE_URI}:${_SOURCE_SHA}
substitutions:
  _VITE_FORGELEX_SAVED_RESEARCH_ENABLED: 'false'
