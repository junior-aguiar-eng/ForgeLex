steps:
  - name: node:22-bookworm
    entrypoint: bash
    secretEnv:
      - FORGELEX_PHASE8_API_KEY
      - FORGELEX_METRICS_TOKEN
    args:
      - -ceu
      - |
        corepack enable
        pnpm install --frozen-lockfile
        export FORGELEX_PHASE8_BASE_URL=https://hml.nexojuris.ia.br
        node --input-type=module -e "const r=await fetch(process.env.FORGELEX_PHASE8_BASE_URL+'/api/v2/billing/account',{headers:{authorization:'Bearer '+process.env.FORGELEX_PHASE8_API_KEY}}); const b=await r.json(); console.log(JSON.stringify({billingStatus:r.status,balanceCents:b?.data?.balanceCents ?? b?.balanceCents,availableCents:b?.data?.availableCents ?? b?.availableCents,error:b?.error?.code}));"
        export FORGELEX_PHASE8_IDEMPOTENCY_KEY=phase8-rest-$BUILD_ID
        pnpm phase8:smoke-remote
        export FORGELEX_PHASE8_IDEMPOTENCY_KEY=phase8-mcp-$BUILD_ID
        pnpm phase8:mcp-remote
        export FORGELEX_PHASE8_IDEMPOTENCY_KEY=phase8-agent-$BUILD_ID
        pnpm phase8:agent-core-remote
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/forgelex-hml-api-key/versions/latest
      env: FORGELEX_PHASE8_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/forgelex-hml-metrics-token/versions/latest
      env: FORGELEX_METRICS_TOKEN
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
