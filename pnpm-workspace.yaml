packages:
  - 'packages/*'
  - 'apps/*'
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
# Storage 8.2.0 still pulls gaxios 6.7.1, which requests vulnerable uuid 9.
# Keep gaxios on its supported major and supply the patched CJS-compatible uuid.
overrides:
  '@hono/node-server@2.1.1': 2.1.3
  '@modelcontextprotocol/sdk@1.30.0': 1.32.0
  '@modelcontextprotocol/client@2.0.0': 2.3.0
  hono@4.13.8: 4.13.11
  zod@4.6.5: 4.6.7
  vitest@4.1.12>vite: 7.3.7
  ip-address@10.7.1: 10.7.4
  body-parser@2.3.0: 2.4.0
  gaxios@6.7.1>uuid: 11.1.1
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'fast-uri@>=4.0.0 <4.2.3': 4.2.3
  source-map-js@1.2.1: 1.2.2
  postcss-selector-parser@6.1.4: 7.1.6
  # @fastify/static 10.x still asks for glob 13, which carries GHSA-3g3m-2fjr-6pw4 and, through minimatch 10,
  # GHSA-g3hv-75wg-m249. glob 14.0.3 depends on the patched minimatch 11.
  glob@13.0.6: 14.0.3
  # ESLint 10 and its helpers still ask for minimatch 10 (GHSA-g3hv-75wg-m249).
  minimatch@10.2.6: 11.0.3
allowBuilds:
  '@modelcontextprotocol/ext-apps': false
  esbuild: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.273'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.273'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.273'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.273'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.273'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.273'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.273'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.273'
  - '@anthropic-ai/claude-agent-sdk@0.3.273'
  - '@anthropic-ai/sdk@0.126.0'
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
